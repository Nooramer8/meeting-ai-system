services:
  postgres:
    image: postgres:16-alpine
    container_name: meeting_ai_postgres
    environment:
      POSTGRES_DB: meeting_ai
      POSTGRES_USER: meeting_ai
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_ai -d meeting_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meeting_ai_redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: meeting_ai_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  ollama:
    image: ollama/ollama:latest
    container_name: meeting_ai_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: meeting_ai_backend
    working_dir: /app
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    command: php artisan serve --host=0.0.0.0 --port=8001 --no-reload

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: meeting_ai_queue
    working_dir: /app
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    command: php artisan queue:work --queue=meetings,emails,default --tries=1 --timeout=900

  frontend:
    image: node:20-alpine
    container_name: meeting_ai_frontend
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8001/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5174:5174"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  ollama_data:
